# Intégration continue : lint + typecheck + tests (moteur et E2E) sur chaque push et pull request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests du moteur (Vitest)
        run: npm test

      - name: Build electron-vite
        run: npm run build

      - name: Tests E2E (Playwright + Electron)
        run: xvfb-run -a npx playwright test

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
